<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragonswood Placement Reports</title>
<style>body{margin:0;background:#050b21;color:#edf7ff;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:22px}h1,h2,h3{font-family:Georgia,serif;color:#ffe170}.notice,.card{border:1px solid #385888;border-radius:14px;background:#0b1738;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#183769;color:#dff8ff;font-weight:800;margin:2px}.good{color:#82edb0}.gap{color:#ffaaaa}details{margin-top:12px}summary{cursor:pointer;font-weight:900;color:#8eeaff}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}th,td{padding:8px;border-bottom:1px solid #29446d;text-align:left;vertical-align:top}th{color:#8eeaff}select{background:#0b1738;color:white;border:1px solid #5478a7;border-radius:8px;padding:9px}</style></head><body><main><h1>📊 Math & ELA Placement Reports</h1><p class="notice" id="status">Opening private teacher reports…</p><div id="reports"></div></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getFirestore,collection,getDocs}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const config={apiKey:"AIzaSyC918WJoGQgxRKsqcz-3bXI7iZWv_1bwYE",authDomain:"dragonswood-9289e.firebaseapp.com",projectId:"dragonswood-9289e",storageBucket:"dragonswood-9289e.firebasestorage.app",messagingSenderId:"1064477064695",appId:"1:1064477064695:web:283e1016ee2303d39042f2"},db=getFirestore(initializeApp(config)),auth=getAuth(),status=document.querySelector('#status'),host=document.querySelector('#reports'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function subjectCard(report){const levels=['foundation','4','5','6'],name=report.subject==='MATH'?'Math':'ELA';return `<section class="card"><h3>${name}: ${esc(report.placementLabel)}</h3><p><b>${esc(report.relativePlacement)}</b> • Confidence: ${esc(report.confidence)}</p><div>${levels.map(l=>{const x=report.levelSummary?.[l]||{};return `<span class="pill">${l==='foundation'?'Foundation':`Grade ${l}`}: ${x.correct||0}/${x.tested||0}</span>`}).join('')}</div><details><summary>Standard-by-standard evidence (${report.standards?.length||0})</summary><table><thead><tr><th>Standard</th><th>Skill</th><th>Band</th><th>Evidence</th><th>Meaning</th></tr></thead><tbody>${(report.standards||[]).map(x=>`<tr><td>${esc(x.standardId)}</td><td>${esc(x.skill)}<details><summary>Exact item</summary><b>Question:</b> ${esc(x.prompt)}<br><b>Student:</b> ${esc(x.studentAnswer||'No answer recorded')}<br><b>Expected:</b> ${esc(x.expectedAnswer)}</details></td><td>${esc(x.relativeLabel)}</td><td class="${x.correct?'good':'gap'}">${x.correct?'Demonstrated':'Not demonstrated'}</td><td>${esc(x.interpretation)}</td></tr>`).join('')}</tbody></table></details></section>`}
function render(rows){if(!rows.length){host.innerHTML='<div class="notice">No students have completed the placement benchmark yet.</div>';return}host.innerHTML=rows.sort((a,b)=>String(a.studentName).localeCompare(String(b.studentName))).map(r=>`<article class="card"><h2>${esc(r.studentName)} <small>• Enrolled Grade ${esc(r.enrolledGrade)}</small></h2><div class="grid">${subjectCard(r.math)}${subjectCard(r.ela)}</div></article>`).join('')}
onAuthStateChanged(auth,async user=>{if(!user){status.textContent='Open this page from your signed-in Teacher Command.';return}try{const snap=await getDocs(collection(db,'placementReports')),rows=snap.docs.map(d=>({id:d.id,...d.data()}));status.textContent=`Private teacher view • ${rows.length} completed report${rows.length===1?'':'s'} • Students cannot read this collection.`;render(rows)}catch(e){status.textContent='Teacher access is required to open placement reports.';console.error(e)}});</script></body></html>
