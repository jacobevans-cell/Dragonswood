  <body>
    <a class="skip" href="#main">Skip to lesson</a>
    <div id="app">
      <main class="loading" data-quest-opening>
        <h1>Dragonswood</h1>
        <p data-quest-opening-status role="status">Opening your quest…</p>
        <button class="btn" data-quest-opening-retry hidden>Try opening my quest again</button>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script>
      (()=>{
        const retry=document.querySelector('[data-quest-opening-retry]');
        retry.addEventListener('click',()=>{try{window.parent.location.reload()}catch{location.reload()}});
        const recover=()=>{const opening=document.querySelector('[data-quest-opening]');if(!opening)return;opening.querySelector('[data-quest-opening-status]').textContent='Opening your quest is taking too long. Your saved work is safe. Try again.';retry.hidden=false;};
        const timer=setTimeout(recover,20000);
        const failed=event=>{if(event.type==='unhandledrejection'||event.target?.tagName==='SCRIPT'||event.message)recover();};
        window.addEventListener('error',failed,true);
        window.addEventListener('unhandledrejection',failed);
        const done=new MutationObserver(()=>{if(!document.querySelector('[data-quest-opening]')){clearTimeout(timer);window.removeEventListener('error',failed,true);window.removeEventListener('unhandledrejection',failed);done.disconnect();}});
        done.observe(document.getElementById('app'),{childList:true,subtree:true});
      })();
    </script>
    <script type="module" src="./app.js?v=dragon-path-15"></script>
