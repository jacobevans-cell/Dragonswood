<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dragonswood Placement Reports</title>
<style>
body{margin:0;background:#050b21;color:#edf7ff;font:15px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:14px}h1,h2,h3{font-family:Georgia,serif;color:#ffe170}.notice,.student{border:1px solid #385888;border-radius:12px;background:#0b1738;padding:12px;margin:9px 0}.summary{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:8px;margin:10px 0}.metric{border:1px solid #31527e;border-radius:10px;background:#08142f;padding:10px}.metric b{display:block;font-size:20px;color:#ffe170}.metric small,.student-head small,.empty-note{color:#b9c8df}.student-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.student-head h2{font-size:18px;margin:0}.student-head small{font:600 13px system-ui,sans-serif}.badge{border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;white-space:nowrap}.complete{background:#134f3b;color:#9bf3c1}.progress{background:#5a4314;color:#ffe28a}.waiting{background:#253451;color:#c8d5e9}.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.subject{border:1px solid #31527e;border-radius:10px;background:#091633;padding:10px}.subject h3{font-size:16px;margin:0 0 4px}.subject p{margin:3px 0;font-size:13px}.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#183769;color:#dff8ff;font-size:12px;font-weight:800;margin:2px}.good{color:#82edb0}.gap{color:#ffaaaa}details{margin-top:7px}summary{cursor:pointer;font-weight:900;color:#8eeaff}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}th,td{padding:7px;border-bottom:1px solid #29446d;text-align:left;vertical-align:top}th{color:#8eeaff}.empty-note{margin:7px 0 0}.filters{display:flex;flex-wrap:wrap;gap:7px}.filters button{border:1px solid #5478a7;border-radius:999px;padding:7px 11px;background:#0b1738;color:#edf7ff;font-weight:800;cursor:pointer}.filters button[aria-pressed="true"]{background:#176991;border-color:#75dcff}.hidden{display:none}@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}.subjects{grid-template-columns:1fr}.student-head{align-items:flex-start}}
</style></head><body><main><h1>📊 Math &amp; ELA Placement Reports</h1><p class="notice" id="status">Opening private teacher reports…</p><div id="dashboard"></div><div id="reports"></div></main>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getFirestore,collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const config={apiKey:"AIzaSyC918WJoGQgxRKsqcz-3bXI7iZWv_1bwYE",authDomain:"dragonswood-9289e.firebaseapp.com",projectId:"dragonswood-9289e",storageBucket:"dragonswood-9289e.firebasestorage.app",messagingSenderId:"1064477064695",appId:"1:1064477064695:web:283e1016ee2303d39042f2"},db=getFirestore(initializeApp(config)),auth=getAuth(),status=document.querySelector('#status'),dashboard=document.querySelector('#dashboard'),host=document.querySelector('#reports'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function subjectCard(report){const levels=['foundation','4','5','6'],name=report.subject==='MATH'?'Math':'ELA';return `<section class="subject"><h3>${name}: ${esc(report.placementLabel)}</h3><p><b>${esc(report.relativePlacement)}</b> • Confidence: ${esc(report.confidence)}</p><div>${levels.map(l=>{const x=report.levelSummary?.[l]||{};return `<span class="pill">${l==='foundation'?'Foundation':`Grade ${l}`}: ${x.correct||0}/${x.tested||0}</span>`}).join('')}</div><details><summary>Standards evidence (${report.standards?.length||0})</summary><table><thead><tr><th>Standard</th><th>Skill</th><th>Band</th><th>Evidence</th><th>Meaning</th></tr></thead><tbody>${(report.standards||[]).map(x=>`<tr><td>${esc(x.standardId)}</td><td>${esc(x.skill)}<details><summary>Exact item</summary><b>Question:</b> ${esc(x.prompt)}<br><b>Student:</b> ${esc(x.studentAnswer||'No answer recorded')}<br><b>Expected:</b> ${esc(x.expectedAnswer)}</details></td><td>${esc(x.relativeLabel)}</td><td class="${x.correct?'good':'gap'}">${x.correct?'Demonstrated':'Not demonstrated'}</td><td>${esc(x.interpretation)}</td></tr>`).join('')}</tbody></table></details></section>`}
function buildReport(row){const grade=Number(row.enrolledGrade)||4,labels={foundation:'Foundation (Grades 2–3)',4:'Grade 4',5:'Grade 5',6:'Grade 6'},levels=['foundation','4','5','6'],number=l=>l==='foundation'?3:Number(l);function subject(subject){const rows=(row.placementResponses||[]).filter(x=>x.subject===subject),summary={};levels.forEach(l=>{const a=rows.filter(x=>x.placementLevel===l),correct=a.filter(x=>x.correct).length;summary[l]={correct,tested:a.length,percent:a.length?Math.round(correct/a.length*100):0}});let placement='foundation';if(summary['4'].percent>=70&&summary.foundation.percent>=60)placement='4';if(summary['5'].percent>=70&&summary['4'].percent>=60)placement='5';if(summary['6'].percent>=70&&summary['5'].percent>=60)placement='6';const delta=number(placement)-grade,at=summary[placement],standards=rows.map(x=>{const relative=Number(x.gradeLevel)-grade;return{...x,relativeLabel:relative===0?'enrolled-grade standard':relative<0?`${Math.abs(relative)} grade level${Math.abs(relative)===1?'':'s'} below enrolled grade`:`${relative} grade level${relative===1?'':'s'} above enrolled grade`,interpretation:x.correct?(relative>0?'advanced evidence demonstrated':relative<0?'prerequisite demonstrated':'grade-level evidence demonstrated'):(relative>0?'advanced standard not yet demonstrated':relative<0?'missing prerequisite evidence':'grade-level support indicated')}});return{subject,placementLabel:labels[placement],relativePlacement:delta===0?'at enrolled grade':delta<0?`${Math.abs(delta)} grade level${Math.abs(delta)===1?'':'s'} behind enrolled grade`:`${delta} grade level${delta===1?'':'s'} ahead of enrolled grade`,confidence:at.tested>=12&&(at.percent<35||at.percent>=85)?'high':at.tested>=10?'moderate':'teacher review recommended',levelSummary:summary,standards}}return{...row,math:subject('MATH'),ela:subject('ELA')}}
const stamp=row=>Number(row?.updatedAt?.seconds||row?.completedAt?.seconds||row?.createdAt?.seconds||0),studentName=row=>row.firstName||row.displayName||row.studentName||String(row.email||row.studentEmail||'Student').split('@')[0],isRosterStudent=row=>row.deletedAt==null&&row.active!==false&&row.portalAccessDisabled!==true&&String(row.role||'student').toLowerCase()!=='teacher';
function studentCard(row){const badge=row.trackingStatus==='complete'?'<span class="badge complete">✓ Complete</span>':row.trackingStatus==='in_progress'?'<span class="badge progress">◐ In progress</span>':'<span class="badge waiting">○ Not started</span>';return `<article class="student" data-status="${row.trackingStatus}"><header class="student-head"><h2>${esc(row.studentName)} <small>• Enrolled Grade ${esc(row.enrolledGrade)}</small></h2>${badge}</header>${row.trackingStatus==='complete'?`<div class="subjects">${subjectCard(row.math)}${subjectCard(row.ela)}</div>`:`<p class="empty-note">${row.trackingStatus==='in_progress'?`${Number(row.attempts)||row.placementResponses?.length||0} answers saved. The detailed report will appear when both subjects are finished.`:'No benchmark answers have been saved yet.'}</p>`}</article>`}
function setFilter(value){document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===value)));document.querySelectorAll('[data-status]').forEach(card=>card.classList.toggle('hidden',value!=='all'&&card.dataset.status!==value))}
function render(rows){const counts={complete:0,in_progress:0,not_started:0};rows.forEach(r=>counts[r.trackingStatus]++);dashboard.innerHTML=`<section class="summary"><div class="metric"><b>${rows.length}</b><small>Enrolled students</small></div><div class="metric"><b>${counts.complete}</b><small>Complete</small></div><div class="metric"><b>${counts.in_progress}</b><small>In progress</small></div><div class="metric"><b>${counts.not_started}</b><small>Not started</small></div></section><nav class="filters" aria-label="Filter benchmark status"><button data-filter="all" aria-pressed="true">All ${rows.length}</button><button data-filter="complete" aria-pressed="false">Complete ${counts.complete}</button><button data-filter="in_progress" aria-pressed="false">In progress ${counts.in_progress}</button><button data-filter="not_started" aria-pressed="false">Not started ${counts.not_started}</button></nav>`;host.innerHTML=rows.length?rows.sort((a,b)=>({in_progress:0,not_started:1,complete:2}[a.trackingStatus]-{in_progress:0,not_started:1,complete:2}[b.trackingStatus])||String(a.studentName).localeCompare(String(b.studentName))).map(studentCard).join(''):'<div class="notice">No enrolled students were found.</div>';document.querySelectorAll('.filters button').forEach(button=>button.addEventListener('click',()=>setFilter(button.dataset.filter)))}
onAuthStateChanged(auth,async user=>{if(!user){status.textContent='Open this page from your signed-in Teacher Command.';return}try{const[progressSnap,rosterSnap]=await Promise.all([getDocs(query(collection(db,'dailyQuestProgress'),where('benchmarkKind','==','math_ela_placement'))),getDocs(collection(db,'students'))]),progress=progressSnap.docs.map(d=>({id:d.id,...d.data()})),latest=new Map;for(const row of progress){const id=String(row.studentId||'');if(id&&(!latest.has(id)||stamp(row)>stamp(latest.get(id))))latest.set(id,row)}const roster=rosterSnap.docs.map(d=>({id:d.id,...d.data()})).filter(isRosterStudent),rows=roster.map(student=>{const saved=latest.get(student.id),trackingStatus=saved?(saved.status==='complete'?'complete':'in_progress'):'not_started',base=saved?buildReport(saved):{};return{...base,studentId:student.id,studentName:studentName(student),enrolledGrade:Number(student.grade||saved?.enrolledGrade)||4,trackingStatus}});status.textContent=`Private teacher view • ${rows.filter(r=>r.trackingStatus==='complete').length} of ${rows.length} students complete • placement results are never shown to students.`;render(rows)}catch(e){status.textContent='Teacher access is required to open placement reports.';console.error(e)}});</script></body></html>
