<script>
const cfg={apiKey:'AIzaSyC918WJoGQgxRKsqcz-3bXI7iZWv_1bwYE',authDomain:'dragonswood-9289e.firebaseapp.com',projectId:'dragonswood-9289e',storageBucket:'dragonswood-9289e.firebasestorage.app',messagingSenderId:'1064477064695',appId:'1:1064477064695:web:283e1016ee2303d39042f2',measurementId:'G-LPRLDGVBD2'};if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),fn=firebase.functions(),who=document.getElementById('who'),log=document.getElementById('log'),b1=document.getElementById('sp010'),ba=document.getElementById('all');
