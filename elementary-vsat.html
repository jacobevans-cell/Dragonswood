<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Elementary VSAT Gradebook</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#dbe1ea;--brand:#4f46e5;--brand2:#312e81;--good:#15803d;--bad:#b91c1c;--shadow:0 8px 24px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input{font:inherit}.app{max-width:1600px;margin:auto;padding:16px}.topbar,.sheet-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.topbar{margin-bottom:14px}.title{display:flex;align-items:center;gap:10px}.title h1{font-size:26px;margin:0}.pill{background:#ede9fe;color:#4338ca;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}.controls,.left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;font-weight:750;cursor:pointer}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.dark{background:var(--brand2);color:#fff;border-color:var(--brand2)}.summary{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:10px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}.stat span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}.stat b{display:block;font-size:22px;margin-top:2px}.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.sheet-head{padding:12px 14px;border-bottom:1px solid var(--line)}.team-tabs{display:flex;background:#eef2ff;border-radius:10px;padding:3px}.team-tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:800;color:#4b5563;cursor:pointer}.team-tab.active{background:#fff;color:#312e81;box-shadow:0 1px 5px rgba(0,0,0,.1)}.table-wrap{overflow:auto;max-height:70vh}.gradebook{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}.gradebook th,.gradebook td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;text-align:center;background:#fff}.gradebook th{position:sticky;top:0;z-index:3;background:#f8fafc;font-size:12px}.gradebook th.player,.gradebook td.player{position:sticky;left:0;z-index:4;text-align:left;min-width:165px}.gradebook th.player{background:#eef2ff}.gradebook td.player{font-weight:800;cursor:pointer}.skill{min-width:105px}.skill-btn{min-width:78px;height:44px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;font-weight:900;cursor:pointer;padding:4px 6px}.skill-btn .big{display:block;font-size:17px}.skill-btn .small{display:block;font-size:10px;color:var(--muted);font-weight:700}.skill-btn.has{background:#eef2ff;border-color:#c7d2fe;color:#312e81}.overall{font-weight:900;font-size:17px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.panel{background:#fff;width:min(980px,96vw);max-height:92vh;overflow:auto;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.panel-body{padding:16px}.close{border:0;background:#f1f5f9;width:36px;height:36px;border-radius:10px;font-size:20px;cursor:pointer}.attempt-grid{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:10px}.attempt-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#f8fafc}.attempt-card b{display:block;margin-bottom:7px}.attempt-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.attempt-actions button{height:42px;border-radius:9px;border:1px solid var(--line);font-weight:900;cursor:pointer}.good{background:#dcfce7!important;color:#166534;border-color:#bbf7d0!important}.bad{background:#fee2e2!important;color:#991b1b;border-color:#fecaca!important}.unset{background:#fff;color:#64748b}.attempt-summary{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.attempt-summary span{padding:7px 10px;border-radius:999px;background:#f1f5f9;font-weight:800}.report-table{width:100%;border-collapse:collapse}.report-table th,.report-table td{border-bottom:1px solid var(--line);padding:8px;text-align:left}.report-table th{font-size:12px;text-transform:uppercase;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px}.detail-card{border:1px solid var(--line);border-radius:12px;padding:12px}.detail-card strong{display:block;font-size:22px}.legend{font-size:12px;color:var(--muted);margin-top:10px}.danger{color:var(--bad)}
@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.attempt-grid{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:repeat(2,1fr)}.app{padding:8px}.title h1{font-size:21px}.gradebook th.player,.gradebook td.player{min-width:130px}}
@media print{body{background:#fff}.no-print,.topbar,.summary,.sheet-head{display:none!important}.app{max-width:none;padding:0}.sheet{box-shadow:none;border:0}.table-wrap{overflow:visible;max-height:none}.gradebook th,.gradebook td{position:static!important;padding:4px}.modal.open{position:static;background:#fff;display:block;padding:0}.modal.open .panel{box-shadow:none;width:100%;max-height:none}.panel-head .close{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title"><h1>🏐 Elementary VSAT Gradebook</h1><span class="pill">10-Attempt Eval</span></div>
    <div class="controls no-print"><button class="btn" id="reportsBtn">Reports</button><button class="btn primary" id="newBtn">New Assessment</button></div>
  </div>
  <div class="summary">
    <div class="stat"><span>Team Average</span><b id="teamAvg">—</b></div><div class="stat"><span>Players Started</span><b id="playersScored">0</b></div><div class="stat"><span>Best Skill</span><b id="bestSkill">—</b></div><div class="stat"><span>Needs Work</span><b id="weakSkill">—</b></div>
  </div>
  <section class="sheet">
    <div class="sheet-head no-print"><div class="left"><div class="team-tabs" id="teamTabs"></div><label><strong>Date</strong> <input type="date" id="dateInput" class="btn"></label></div><div class="controls"><button class="btn" id="clearBtn">Clear This Date</button><button class="btn dark" id="printBtn">Print / PDF</button></div></div>
    <div class="table-wrap"><table class="gradebook" id="gradebook"></table></div>
  </section>
</div>

<div class="modal" id="attemptModal"><div class="panel"><div class="panel-head"><div><b id="attemptTitle">Attempts</b><div id="attemptSub" style="color:#6b7280;font-size:13px"></div></div><button class="close" data-close="attemptModal">×</button></div><div class="panel-body"><div class="attempt-summary" id="attemptSummary"></div><div class="attempt-grid" id="attemptGrid"></div><div class="legend">Tap ✓ for a successful attempt or ✕ for an unsuccessful attempt. Tap the selected result again to clear it.</div></div></div></div>
<div class="modal" id="playerModal"><div class="panel"><div class="panel-head"><div><b id="playerTitle">Player Report</b><div id="playerSub" style="color:#6b7280;font-size:13px"></div></div><button class="close" data-close="playerModal">×</button></div><div class="panel-body" id="playerBody"></div></div></div>
<div class="modal" id="reportModal"><div class="panel"><div class="panel-head"><div><b>Team VSAT Report</b><div id="reportSub" style="color:#6b7280;font-size:13px"></div></div><button class="close" data-close="reportModal">×</button></div><div class="panel-body" id="reportBody"></div></div></div>
<script>
const skills=['Serve','Pass','Set','Attack','Movement','Court IQ','Live Play'];
const rosters={Varsity:['Rebelle','Ainslee','Gabrielle','Luxanna','Jeslynn','Avery','Sadie','Chelsea','Celestina','Molly','Adalia'],JV:['Nala','Whitney','Marli','Lilian','Niyane','Aliya','Krystal','Andi','Alaina','Kataleya','Abagail','Larissa'],Boys:['Kade','Stula','Alejandro','Brito','Tristan','Ruth']};
let team=localStorage.vsatTeam||'Varsity';let date=new Date().toISOString().slice(0,10);let activeCell=null;const $=s=>document.querySelector(s);const key=()=>`vsat:${team}:${date}`;const read=()=>JSON.parse(localStorage.getItem(key())||'{}');const write=d=>{localStorage.setItem(key(),JSON.stringify(d));render();if(activeCell&&$('#attemptModal').classList.contains('open'))renderAttempts();};const avg=a=>{const n=a.filter(Number.isFinite);return n.length?n.reduce((x,y)=>x+y,0)/n.length:null};
function normalizeSkill(v){if(Array.isArray(v))return v.slice(0,10);if(Number.isFinite(v)){const successes=Math.max(0,Math.min(10,Math.round(v*2)));return Array.from({length:10},(_,i)=>i<successes?1:null)}return Array(10).fill(null)}
function skillStats(data,name,skill){const arr=normalizeSkill(data?.[name]?.[skill]);const done=arr.filter(v=>v===1||v===0);const made=arr.filter(v=>v===1).length;return {arr,done:done.length,made,pct:done.length?made/done.length*100:null};}
function playerAvg(data,name){const p=skills.map(s=>skillStats(data,name,s).pct).filter(Number.isFinite);return avg(p)}
function teamTabs(){const box=$('#teamTabs');box.innerHTML='';Object.keys(rosters).forEach(t=>{const b=document.createElement('button');b.className='team-tab'+(t===team?' active':'');b.textContent=t;b.onclick=()=>{team=t;localStorage.vsatTeam=t;teamTabs();render()};box.appendChild(b)});}
function render(){date=$('#dateInput').value||date;const data=read();let html='<thead><tr><th class="player">Player</th>'+skills.map(s=>`<th class="skill">${s}<br><span style="font-weight:500;color:#64748b">10 attempts</span></th>`).join('')+'<th class="skill">Overall</th></tr></thead><tbody>';rosters[team].forEach(name=>{html+=`<tr><td class="player" data-player="${name}">${name}</td>`;skills.forEach(s=>{const st=skillStats(data,name,s);const label=st.done?`${st.made}/${st.done}`:'—';const pct=st.pct==null?'Not started':`${Math.round(st.pct)}%`;html+=`<td><button class="skill-btn ${st.done?'has':''}" data-player="${name}" data-skill="${s}"><span class="big">${label}</span><span class="small">${pct}</span></button></td>`});const pa=playerAvg(data,name);html+=`<td><span class="overall">${pa==null?'—':Math.round(pa)+'%'}</span></td></tr>`});html+='</tbody>';$('#gradebook').innerHTML=html;document.querySelectorAll('.skill-btn').forEach(b=>b.onclick=()=>openAttempts(b.dataset.player,b.dataset.skill));document.querySelectorAll('td.player').forEach(c=>c.onclick=()=>openPlayer(c.dataset.player));updateSummary(data)}
function updateSummary(data){const pas=rosters[team].map(n=>playerAvg(data,n)).filter(Number.isFinite);$('#teamAvg').textContent=pas.length?Math.round(avg(pas))+'%':'—';$('#playersScored').textContent=pas.length;const skillAvgs=skills.map(s=>[s,avg(rosters[team].map(n=>skillStats(data,n,s).pct).filter(Number.isFinite))]).filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);$('#bestSkill').textContent=skillAvgs.length?`${skillAvgs[0][0]} ${Math.round(skillAvgs[0][1])}%`:'—';$('#weakSkill').textContent=skillAvgs.length?`${skillAvgs.at(-1)[0]} ${Math.round(skillAvgs.at(-1)[1])}%`:'—'}
function openAttempts(player,skill){activeCell={player,skill};$('#attemptTitle').textContent=`${player} · ${skill}`;$('#attemptSub').textContent=`${team} · ${date} · 10 attempts`;renderAttempts();$('#attemptModal').classList.add('open')}
function renderAttempts(){const d=read();const st=skillStats(d,activeCell.player,activeCell.skill);$('#attemptSummary').innerHTML=`<span><b>${st.made}</b> successful</span><span><b>${st.done-st.made}</b> unsuccessful</span><span><b>${st.done}/10</b> recorded</span><span><b>${st.pct==null?'—':Math.round(st.pct)+'%'}</b></span>`;$('#attemptGrid').innerHTML=st.arr.map((v,i)=>`<div class="attempt-card"><b>Attempt ${i+1}</b><div class="attempt-actions"><button class="${v===1?'good':'unset'}" onclick="setAttempt(${i},1)">✓</button><button class="${v===0?'bad':'unset'}" onclick="setAttempt(${i},0)">✕</button></div></div>`).join('')}
function setAttempt(i,v){const d=read();d[activeCell.player]=d[activeCell.player]||{};const arr=normalizeSkill(d[activeCell.player][activeCell.skill]);arr[i]=arr[i]===v?null:v;d[activeCell.player][activeCell.skill]=arr;write(d)}
function openPlayer(name){const d=read();const pa=playerAvg(d,name);$('#playerTitle').textContent=name;$('#playerSub').textContent=`${team} · ${date}`;$('#playerBody').innerHTML=`<div class="detail-grid"><div class="detail-card"><span>Overall</span><strong>${pa==null?'—':Math.round(pa)+'%'}</strong></div>${skills.map(s=>{const st=skillStats(d,name,s);return `<div class="detail-card"><span>${s}</span><strong>${st.done?st.made+'/'+st.done:'—'}</strong><small>${st.pct==null?'Not started':Math.round(st.pct)+'%'}</small></div>`}).join('')}</div><h3>Detailed Results</h3><table class="report-table"><tr><th>Skill</th><th>Success</th><th>Attempts</th><th>Rate</th></tr>${skills.map(s=>{const st=skillStats(d,name,s);return `<tr><td>${s}</td><td>${st.made}</td><td>${st.done}/10</td><td>${st.pct==null?'—':Math.round(st.pct)+'%'}</td></tr>`}).join('')}</table><div style="margin-top:14px"><button class="btn dark" onclick="window.print()">Print / Save PDF</button></div>`;$('#playerModal').classList.add('open')}
function openReports(){const d=read();const ranked=rosters[team].map(n=>({n,a:playerAvg(d,n)})).sort((a,b)=>(b.a??-1)-(a.a??-1));$('#reportSub').textContent=`${team} · ${date}`;$('#reportBody').innerHTML=`<h3>Player Rankings</h3><table class="report-table"><tr><th>Rank</th><th>Player</th><th>Overall</th></tr>${ranked.map((r,i)=>`<tr><td>${r.a==null?'—':i+1}</td><td><b>${r.n}</b></td><td>${r.a==null?'—':Math.round(r.a)+'%'}</td></tr>`).join('')}</table><h3>Team Skill Averages</h3><table class="report-table"><tr><th>Skill</th><th>Average</th></tr>${skills.map(s=>{const a=avg(rosters[team].map(n=>skillStats(d,n,s).pct).filter(Number.isFinite));return `<tr><td>${s}</td><td>${a==null?'—':Math.round(a)+'%'}</td></tr>`}).join('')}</table><div style="margin-top:14px"><button class="btn dark" onclick="window.print()">Print / Save PDF</button></div>`;$('#reportModal').classList.add('open')}
$('#dateInput').value=date;$('#dateInput').onchange=()=>{date=$('#dateInput').value;render()};$('#reportsBtn').onclick=openReports;$('#newBtn').onclick=()=>{$('#dateInput').value=new Date().toISOString().slice(0,10);date=$('#dateInput').value;render()};$('#printBtn').onclick=()=>window.print();$('#clearBtn').onclick=()=>{if(confirm(`Clear all ${team} VSAT results for ${date}?`)){localStorage.removeItem(key());render()}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('open'));document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open')}));teamTabs();render();
</script>
</body>
</html>
